[project]
name = "springwinter-infrastructure"
version = "0.1.0"
description = "CDK source for the Spring Winter customer bootstrap stack"
requires-python = ">=3.12"
dependencies = [
  "aws-cdk-lib==2.269.0",
  "constructs>=10.0,<11",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

