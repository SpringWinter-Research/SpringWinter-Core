[project]
name = "springwinter-orchestrator"
version = "0.1.0"
description = "Customer-account Orchestra Lambda handlers and contracts"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

